<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Survey-BIM Viewer (Section Outlines and Coordinates)</title>
  <style>
    :root { --bg: #eef3f8; --panel: rgba(255, 255, 255, 0.88); --line: #d7e0ea; --text: #1f2937; --accent: #0ea5e9; --accent2: #2563eb; --shadow: 0 10px 30px rgba(15,23,42,0.15); }
    * { box-sizing: border-box; }
    body { margin: 0; overflow: hidden; font-family: 'Inter', Segoe UI, Arial, sans-serif; background: var(--bg); color: var(--text); user-select: none; }
    #canvas-bg { position: absolute; inset: 0; z-index: 0; background: linear-gradient(180deg, #dfeaf6 0%, #eef3f8 60%, #f7f9fc 100%); }
    #canvas-container { position: absolute; inset: 0; z-index: 1; }
    
    .glass-panel { background: var(--panel); backdrop-filter: blur(12px); border: 1px solid var(--line); box-shadow: var(--shadow); border-radius: 12px; padding: 16px; z-index: 100; position: absolute; }
    
    /* Bottom Loader Bar */
    #bottomLoader { bottom: 24px; left: 50%; transform: translateX(-50%); display: flex; gap: 16px; align-items: center; width: max-content; }
    #bottomLoader.imports-collapsed { display: none; }
    #toggleImports { position: fixed; z-index: 150; left: 50%; bottom: 0; transform: translateX(-50%); border:1px solid var(--line); border-radius:8px 8px 0 0; background:rgba(255,255,255,.94); color:var(--text); padding:5px 14px; font-size:12px; font-weight:700; cursor:pointer; box-shadow:0 -3px 12px rgba(15,23,42,.08); white-space:nowrap; }
    #toggleImports:hover { background:#fff; }
    .file-group { display: flex; flex-direction: column; gap: 6px; }
    .file-group span { font-size: 11px; font-weight: 700; color: #475569; text-transform: uppercase; letter-spacing: 0.05em; }
    input[type="file"] { font-size: 12px; color: var(--text); background: #fff; border: 1px solid var(--line); padding: 8px 12px; border-radius: 8px; cursor: pointer; max-width: 250px; }
    
    /* Right Toolbar (Settings) */
    #rightToolbar { top: 24px; right: 24px; width: 320px; display: flex; flex-direction: column; gap: 14px; max-height: calc(100vh - 48px); overflow-y: auto; transition: transform 0.3s ease; }
    #rightToolbar.collapsed { transform: translateX(calc(100% + 40px)); }
    #rightToolbar h2 { margin: 0; font-size: 14px; font-weight: 700; border-bottom: 1px solid var(--line); padding-bottom: 8px; }
    
    /* Slide Toggle Button */
    #toggleSettings { position: fixed; z-index: 120; right: 344px; left: auto; top: 40px; width: 32px; height: 36px; background: var(--panel); border: 1px solid var(--line); border-right: none; border-radius: 8px 0 0 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 14px; box-shadow: -4px 4px 10px rgba(0,0,0,0.05); color: var(--text); backdrop-filter: blur(12px); }
    #toggleSettings:hover { background: #fff; }
    #toggleSettings.panel-collapsed { right: 0; }
    .section-row { display:flex; align-items:center; gap:4px; margin-top:5px; }
    .section-row button { border:1px solid #cbd5e1; background:#fff; color:#1f2937; border-radius:5px; font-size:11px; padding:5px 7px; cursor:pointer; }
    .section-row .section-name { flex:1; text-align:left; }
    .section-row .section-name.active { color:#fff; background:#2563eb; border-color:#2563eb; }
    #sectionList:empty::after { content:'No section planes'; color:#64748b; font-size:11px; }

    .tool-row { display: flex; justify-content: space-between; align-items: center; font-size: 13px; font-weight: 500; }
    .tool-row input[type="range"] { width: 100px; }
    .tool-row select { max-width: 170px; padding:4px; border:1px solid var(--line); border-radius:6px; font-size:11px; background:#fff; }
    .tool-row input[type="number"], .tool-row input[type="text"] { width: 80px; padding: 4px 6px; border: 1px solid var(--line); border-radius: 6px; font-size: 12px; text-align: right; }
    
    #surfaceMenu { display:none; position:fixed; z-index:200; background:#fff; border:1px solid #cbd5e1; border-radius:8px; box-shadow:0 5px 18px rgba(0,0,0,.2); padding:5px; min-width:165px; }
    #surfaceMenu button { display:block; border:0; background:transparent; text-align:left; width:100%; padding:8px 10px; cursor:pointer; border-radius:4px; }
    #surfaceMenu button:hover { background:#e2e8f0; }
    #surfaceMenu button:disabled { opacity:.4; cursor:default; }
    /* Action Buttons */
    .btn-row { display: flex; gap: 8px; margin-top: 4px; }
    .btn { flex: 1; padding: 10px; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 12px; transition: 0.2s; background: #fff; border: 1px solid var(--line); color: var(--text); }
    .btn:hover { background: #f8fafc; transform: translateY(-1px); }
    .btn-primary { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; border: none; }
    .btn-primary:hover { background: linear-gradient(135deg, var(--accent2), var(--accent)); color: #fff; }
    
    /* Floating Labels & Inspect Cards */
    .tolValueLabel { position: absolute; z-index: 29; background: transparent; border: none; padding: 0; font-weight: 700; line-height: 1; pointer-events: none; white-space: nowrap; text-shadow: 0 0 3px rgba(255,255,255,.95), 0 0 8px rgba(255,255,255,.9); transform: translate(8px, -8px); }
    .inspectCard { position: absolute; z-index: 40; background: #1e293b; color: #fff; border: 1px solid #475569; border-radius: 10px; padding: 10px 14px; font-size: 12px; line-height: 1.4; box-shadow: 0 10px 25px rgba(0,0,0,0.3); pointer-events: none; white-space: pre; transform: translate(12px, -12px); }
  </style>
</head>
<body>
<div id="canvas-bg"></div>
<div id="canvas-container"></div>
<div id="surfaceMenu">
  <button id="createPlaneCut">Create plane cut here</button>
  <button id="clearAllContext">Clear All Sections</button>
  <button id="spotCoordinate">Spot Coordinate</button>
  <button id="clearAllCoordinates">Clear All Coordinates</button>
</div>

<button id="toggleImports" type="button" aria-controls="bottomLoader" aria-expanded="true" title="Minimize imports">▼ Imports</button>
<div id="bottomLoader" class="glass-panel">
  <div class="file-group">
    <span style="color: var(--accent2);">1. Report CSV (Appendable)</span>
    <input type="file" id="csvInput" accept=".csv" multiple title="Upload Grid Tolerance Report(s)">
  </div>
  <div class="file-group">
    <span>2. Point Cloud (.PTS)</span>
    <input type="file" id="ptsInput" accept=".pts">
  </div>
  <div class="file-group">
    <span>3. 3D Model (.DXF, .STL, .OBJ)</span>
    <input type="file" id="modelInput" accept=".dxf,.obj,.stl,.glb,.gltf">
  </div>
</div>

<button id="toggleSettings" type="button" aria-label="Minimize settings" aria-expanded="true" title="Minimize settings">▶</button>
<div id="rightToolbar" class="glass-panel">
  <h2>Settings</h2>
  <div class="tool-row">
    <label for="orthoToggle">Ortho Camera</label>
    <input type="checkbox" id="orthoToggle">
  </div>
  
  <hr style="border: 0; border-top: 1px solid var(--line); width: 100%; margin: 2px 0;">

  <div class="tool-row">
    <label for="showCsv">Show Points</label>
    <input type="checkbox" id="showCsv" checked>
  </div>
  <div class="tool-row">
    <label for="csvSize">Point Size</label>
    <input type="range" id="csvSize" min="0.05" max="1.0" step="0.05" value="0.3">
  </div>
  <div class="tool-row">
    <label for="showTolText">Show Tolerance Text</label>
    <input type="checkbox" id="showTolText" checked>
  </div>
  <div class="tool-row">
    <label for="tolTextSize">Text Size (px)</label>
    <input type="number" id="tolTextSize" value="11" min="8" max="28" step="1">
  </div>
  <div class="tool-row">
    <label for="ootThreshold">OOT Threshold (mm)</label>
    <input type="number" id="ootThreshold" value="50">
  </div>
  <div class="tool-row">
    <label for="maxTolFilter">Hide &gt; Tolerance (mm)</label>
    <input type="number" id="maxTolFilter" placeholder="e.g. 100" value="">
  </div>

  <hr style="border: 0; border-top: 1px solid var(--line); width: 100%; margin: 2px 0;">

  <div class="tool-row">
    <label for="showPts">Show Point Cloud</label>
    <input type="checkbox" id="showPts" checked>
  </div>
  <div class="tool-row">
    <label for="ptsOpacity">Point Cloud Opacity</label>
    <input type="range" id="ptsOpacity" min="0.0" max="1.0" step="0.1" value="1.0">
  </div>

  <hr style="border: 0; border-top: 1px solid var(--line); width: 100%; margin: 2px 0;">

  <div class="tool-row">
    <label for="showModel">Show 3D Model</label>
    <input type="checkbox" id="showModel" checked>
  </div>
  <div class="tool-row">
    <label for="modelOpacity">Model Opacity</label>
    <input type="range" id="modelOpacity" min="0.1" max="1.0" step="0.1" value="0.8">
  </div>
  
  <hr style="border:0; border-top:1px solid var(--line); width:100%; margin:2px 0;">
  <h2>Section planes</h2>
  <div style="font-size:11px; color:#64748b; line-height:1.4;">Select a surface, then right-click to create a section. Choose a section below to move, flip or remove it.</div>
  <div id="sectionList"></div>
  <div class="btn-row"><button class="btn" id="clearAllSections" type="button">Clear All Sections</button></div>
  <div class="btn-row" style="margin-top: 10px;">
    <button class="btn btn-primary" id="btnFit" style="width: 100%;">Fit View</button>
  </div>
</div>

<!-- Three.js Core -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/TransformControls.js"></script>

<!-- Format Loaders -->
<script src="https://cdn.jsdelivr.net/npm/dxf-parser@1.1.2/dist/dxf-parser.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/STLLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

<script>
const el = id => document.getElementById(id);

let scene, camera, renderer, controls, raycaster;
let csvGroup, ptsGroup, modelGroup, inspectGroup, spotGroup, sectionLineGroup;
let globalShift = { x: 0, y: 0, z: 0 };
let bounds = { minX: Infinity, minY: Infinity, minZ: Infinity, maxX: -Infinity, maxY: -Infinity, maxZ: -Infinity };
let isInitialized = false;

// Data containers
let csvPoints = [], ptsRaw = [];
let spotCoordinates = [], sectionEdgesScheduled = false;
let rawModelData = null, currentModelType = ''; 
let rawDXFBlocks = null; // Stores extracted raw PolyFace block arrays
let toleranceLabels = [];
let inspectPoint = null, inspectCardNode = null;
let selectedSurface = null, selectionOutline = null;
let sections = [], activeSection = null, cutControl = null;
let nextSectionId = 1, showGeometryEdges = true;
const MAX_SECTIONS = 6;
let suppressCutEvents = false, suppressSurfaceClick = false;

function initThree() {
    if(isInitialized) return;
    const container = el('canvas-container');
    scene = new THREE.Scene();
    
    const aspect = window.innerWidth / window.innerHeight;
    camera = new THREE.PerspectiveCamera(60, aspect, 0.1, 100000);
    camera.position.set(20, 20, 20);
    camera.up.set(0, 0, 1);

    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    // Supersample the canvas in addition to requesting hardware multisampling.
    // Limit to 2x to keep GPU memory use reasonable for large point clouds.
    renderer.setPixelRatio(2);
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.localClippingEnabled = true;
    container.appendChild(renderer.domElement);

    controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.screenSpacePanning = true;

    raycaster = new THREE.Raycaster();
    raycaster.params.Points.threshold = 0.2;

    scene.add(new THREE.AmbientLight(0xffffff, 0.8));
    const dl = new THREE.DirectionalLight(0xffffff, 0.9);
    dl.position.set(1, 1, 2);
    scene.add(dl);

    csvGroup = new THREE.Group(); scene.add(csvGroup);
    ptsGroup = new THREE.Group(); scene.add(ptsGroup);
    modelGroup = new THREE.Group(); scene.add(modelGroup);
    inspectGroup = new THREE.Group(); scene.add(inspectGroup);
    spotGroup = new THREE.Group(); scene.add(spotGroup);
    sectionLineGroup = new THREE.Group(); scene.add(sectionLineGroup);

    renderer.domElement.addEventListener('click', (e) => {
        if (!csvPoints.length) return;
        const mouse = new THREE.Vector2(
            (e.clientX / window.innerWidth) * 2 - 1,
            -(e.clientY / window.innerHeight) * 2 + 1
        );
        raycaster.setFromCamera(mouse, camera);
        
        if (csvGroup.children.length > 0) {
            const hits = raycaster.intersectObject(csvGroup.children[0]);
            if (hits.length > 0) {
                const visiblePts = getVisibleCsvPoints();
                const visibleHit = hits.find(h => h.index >= 0 && h.index < visiblePts.length && isSurveyPointVisible(visiblePts[h.index]));
                const idx = visibleHit ? visibleHit.index : -1;
                if (idx >= 0) {
                    inspectPoint = visiblePts[idx];
                    updateInspectCard();
                    return;
                }
            }
        }
        inspectPoint = null;
        updateInspectCard();
    });

    window.addEventListener('resize', () => {
        const aspect = window.innerWidth / window.innerHeight;
        if (camera.isPerspectiveCamera) {
            camera.aspect = aspect;
        } else {
            const height = camera.top - camera.bottom;
            camera.left = -height * aspect / 2;
            camera.right = height * aspect / 2;
        }
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    isInitialized = true;
    setupSurfaceInteraction();
    renderLoop();
}

function renderLoop() {
    requestAnimationFrame(renderLoop);
    controls.update();
    renderer.render(scene, camera);
    updateLabels();
}

function updateBounds(x, y, z) {
    if (x < bounds.minX) bounds.minX = x; if (x > bounds.maxX) bounds.maxX = x;
    if (y < bounds.minY) bounds.minY = y; if (y > bounds.maxY) bounds.maxY = y;
    if (z < bounds.minZ) bounds.minZ = z; if (z > bounds.maxZ) bounds.maxZ = z;
}

function calculateShift() {
    const old = { ...globalShift };
    if (bounds.minX !== Infinity) {
        globalShift = { x: bounds.minX, y: bounds.minY, z: bounds.minZ };
    } else if (currentModelType === 'dxf' && rawModelData && rawModelData.origin) {
        globalShift = { ...rawModelData.origin };
    } else {
        globalShift = { x: 0, y: 0, z: 0 };
    }
    // Keep the camera on the same world location when the floating origin changes.
    if (controls && camera) {
        const dx = old.x - globalShift.x, dy = old.y - globalShift.y, dz = old.z - globalShift.z;
        controls.target.add(new THREE.Vector3(dx, dy, dz));
        camera.position.add(new THREE.Vector3(dx, dy, dz));
        controls.update();
    }
    const shiftDelta = new THREE.Vector3(old.x-globalShift.x, old.y-globalShift.y, old.z-globalShift.z);
    if (selectionOutline) selectionOutline.position.add(shiftDelta);
    for (const spot of spotCoordinates) {
        spot.marker.position.set(spot.point.x-globalShift.x,spot.point.y-globalShift.y,spot.point.z-globalShift.z);
    }
    suppressCutEvents = true;
    for (const section of sections) {
        section.pivot.position.add(shiftDelta);
        section.plane.setFromNormalAndCoplanarPoint(section.plane.normal, section.pivot.position);
    }
    suppressCutEvents = false;
    if (currentModelType === 'dxf') modelGroup.position.set(0, 0, 0);
    else modelGroup.position.set(-globalShift.x, -globalShift.y, -globalShift.z);
}

function worldToScreen(x, y, z) {
    const v = new THREE.Vector3(x - globalShift.x, y - globalShift.y, z - globalShift.z);
    v.project(camera);
    return {
        x: (v.x * .5 + .5) * window.innerWidth,
        y: (-v.y * .5 + .5) * window.innerHeight,
        visible: (v.z >= -1 && v.z <= 1)
    };
}

function getVisibleCsvPoints() {
    const maxTolFilter = parseFloat(el('maxTolFilter').value);
    return csvPoints.filter(p => {
        if (!isNaN(maxTolFilter) && p.tol !== undefined) {
            const mm = Math.abs(p.tol * 1000);
            if (mm > maxTolFilter) return false;
        }
        return true;
    });
}

function clearToleranceLabels() {
    toleranceLabels.forEach(l => l.node.remove());
    toleranceLabels = [];
}

function rebuildToleranceLabels() {
    clearToleranceLabels();
    if (!el('showTolText').checked || !el('showCsv').checked) return;

    const visiblePts = getVisibleCsvPoints();
    const fontSize = parseInt(el('tolTextSize').value) || 11;
    const ootThreshold = parseFloat(el('ootThreshold').value) || 50;

    visiblePts.forEach(p => {
        // Display column I verbatim; F remains the basis of numerical checks.
        if (p.text === undefined || p.text === '') return;
        const node = document.createElement('div');
        node.className = 'tolValueLabel';
        node.textContent = p.text;
        node.style.fontSize = fontSize + 'px';
        const mm = p.tol !== undefined ? Math.round(p.tol * 1000) : undefined;
        if (mm !== undefined && Math.abs(mm) > ootThreshold) node.style.color = '#ef4444';
        else node.style.color = '#000000';
        
        document.body.appendChild(node);
        toleranceLabels.push({ point: p, node });
    });
}

function updateLabels() {
    toleranceLabels.forEach(item => {
        const s = worldToScreen(item.point.x, item.point.y, item.point.z);
        if (s.visible && isSurveyPointVisible(item.point)) {
            item.node.style.left = s.x + 'px';
            item.node.style.top = s.y + 'px';
            item.node.style.display = 'block';
        } else {
            item.node.style.display = 'none';
        }
    });

    for (const spot of spotCoordinates) {
        const projected=worldToScreen(spot.point.x,spot.point.y,spot.point.z);
        if (projected.visible && isSurveyPointVisible(spot.point)) {
            spot.node.style.left=projected.x+'px'; spot.node.style.top=projected.y+'px'; spot.node.style.display='block';
        } else spot.node.style.display='none';
    }
    if (inspectPoint && inspectCardNode) {
        const s = worldToScreen(inspectPoint.x, inspectPoint.y, inspectPoint.z);
        if (s.visible && isSurveyPointVisible(inspectPoint)) {
            inspectCardNode.style.left = s.x + 'px';
            inspectCardNode.style.top = s.y + 'px';
            inspectCardNode.style.display = 'block';
        } else {
            inspectCardNode.style.display = 'none';
        }
    }
}

function updateInspectCard() {
    if (inspectCardNode) { inspectCardNode.remove(); inspectCardNode = null; }
    while(inspectGroup.children.length) inspectGroup.remove(inspectGroup.children[0]);

    if (!inspectPoint) return;

    const sphereGeo = new THREE.SphereGeometry(0.08, 16, 16);
    const sphereMat = new THREE.MeshBasicMaterial({ color: 0x2563eb });
    const marker = new THREE.Mesh(sphereGeo, sphereMat);
    marker.position.set(inspectPoint.x - globalShift.x, inspectPoint.y - globalShift.y, inspectPoint.z - globalShift.z);
    inspectGroup.add(marker);
    applyClipping();

    inspectCardNode = document.createElement('div');
    inspectCardNode.className = 'inspectCard';
    const mmVal = inspectPoint.tol !== undefined ? (inspectPoint.tol * 1000).toFixed(1) + ' mm' : 'N/A';
    inspectCardNode.textContent = `East / X:  ${inspectPoint.x.toFixed(3)} m\n` +
                                `North / Y: ${inspectPoint.y.toFixed(3)} m\n` +
                                `Elev / Z:  ${inspectPoint.z.toFixed(3)} m\n` +
                                `Text: ${mmVal}`;
    document.body.appendChild(inspectCardNode);
}

function buildCsvMesh() {
    if (!isInitialized) return;
    while(csvGroup.children.length) { const obj = csvGroup.children[0]; csvGroup.remove(obj); if (obj.geometry) obj.geometry.dispose(); if (obj.material) obj.material.dispose(); }
    clearToleranceLabels();
    if(!el('showCsv').checked) return;

    const visiblePts = getVisibleCsvPoints();
    if (!visiblePts.length) return;

    const geo = new THREE.BufferGeometry();
    const pos = new Float32Array(visiblePts.length * 3);
    const cols = new Float32Array(visiblePts.length * 3);

    visiblePts.forEach((p, i) => {
        pos[i*3] = p.x - globalShift.x;
        pos[i*3+1] = p.y - globalShift.y;
        pos[i*3+2] = p.z - globalShift.z;
        cols[i*3] = 16/255; cols[i*3+1] = 185/255; cols[i*3+2] = 129/255; // #10b981
    });

    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    geo.setAttribute('color', new THREE.BufferAttribute(cols, 3));

    let pSize = parseFloat(el('csvSize').value);
    if(el('orthoToggle').checked) pSize *= 20;

    const mat = new THREE.PointsMaterial({ size: pSize, sizeAttenuation: true, vertexColors: true });
    
    // Frustum fix: compute bounds aggressively so Threejs knows they exist instantly
    geo.computeBoundingSphere();
    geo.computeBoundingBox();
    const points = new THREE.Points(geo, mat);
    points.frustumCulled = false;
    csvGroup.add(points);

    rebuildToleranceLabels();
    applyClipping();
}

function buildPtsMesh() {
    if (!isInitialized) return;
    while (ptsGroup.children.length) {
        const obj = ptsGroup.children[0]; ptsGroup.remove(obj);
        if (obj.geometry) obj.geometry.dispose();
        if (obj.material) obj.material.dispose();
    }
    if (!ptsRaw.length || !el('showPts').checked) return;

    const geo = new THREE.BufferGeometry();
    const pos = new Float32Array(ptsRaw.length * 3);
    const cols = new Float32Array(ptsRaw.length * 3);
    ptsRaw.forEach((p, i) => {
        const j=i*3;
        pos[j]=p.x-globalShift.x; pos[j+1]=p.y-globalShift.y; pos[j+2]=p.z-globalShift.z;
        if (p.hasRGB) {
            cols[j]=p.r; cols[j+1]=p.g; cols[j+2]=p.b;
        } else {
            cols[j]=cols[j+1]=cols[j+2]=0.5;
        }
    });
    geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
    geo.setAttribute('color',new THREE.BufferAttribute(cols,3));
    const opacity = parseFloat(el('ptsOpacity').value);
    const pointSize = el('orthoToggle').checked ? 1.0 : 0.05;
    const mat = new THREE.PointsMaterial({size:pointSize,sizeAttenuation:true,vertexColors:true,
        transparent:opacity<1,opacity,depthWrite:opacity>=1});
    geo.computeBoundingSphere(); geo.computeBoundingBox();
    const points=new THREE.Points(geo,mat); points.frustumCulled=false;
    ptsGroup.add(points); applyClipping();
}

// ASCII DXF PolyFace reader: resolves model-space block instances and OCS INSERTs.
function parsePolyfaceDXF(text) {
    const lines = text.replace(/^\uFEFF/, '').split(/\r?\n/);
    if (lines[0] && lines[0].includes('AutoCAD Binary DXF')) throw new Error('Binary DXF is not supported; export ASCII DXF.');
    const blocks = new Map(), layers = new Map(), root = [], warnings = [];
    let section = '', block = null, poly = null, rec = null, definitions = 0;

function buildModelMesh() {
    if (!isInitialized) return;
    while(modelGroup.children.length) {
        const obj=modelGroup.children[0]; modelGroup.remove(obj);
        obj.traverse(child => {
            if (child.userData && child.userData.edgeOverlay) { if(child.geometry) child.geometry.dispose(); if(child.material) child.material.dispose(); }
        });
        if (obj.userData && obj.userData.ownedDxf) { if(obj.geometry) obj.geometry.dispose(); if(obj.material) obj.material.dispose(); }
    }
    if(!rawModelData || !el('showModel').checked) { scheduleSectionEdges(); return; }

    const opacity = parseFloat(el('modelOpacity').value);
    const isTransparent = opacity < 1.0;
    const defaultColor = 0xcad4e0;

    if (currentModelType === 'dxf') {
        const world = rawModelData.positions;
        const local = new Float32Array(world.length);
        for (let i = 0; i < world.length; i += 3) {
            local[i] = world[i] - globalShift.x;
            local[i+1] = world[i+1] - globalShift.y;
            local[i+2] = world[i+2] - globalShift.z;
        }
        const geo = new THREE.BufferGeometry();
        geo.setAttribute('position', new THREE.BufferAttribute(local, 3));
        geo.setAttribute('color', new THREE.Float32BufferAttribute(rawModelData.colors, 3));
        geo.setIndex(rawModelData.indices);
        geo.computeBoundingBox(); geo.computeBoundingSphere();
        const mat = new THREE.MeshBasicMaterial({ color: 0xffffff, vertexColors: true, transparent: isTransparent, opacity, side: THREE.DoubleSide });
        modelGroup.position.set(0,0,0);
        const mesh=new THREE.Mesh(geo, mat); mesh.userData.ownedDxf=true; modelGroup.add(mesh);
        if (showGeometryEdges && rawModelData.edgeIndices.length) {

            edgeGeo.setIndex(rawModelData.edgeIndices);

            const edgeLines=new THREE.LineSegments(edgeGeo,edgeMat);

                    color: defaultColor, transparent: isTransparent, opacity: opacity, side: THREE.DoubleSide
                });

    } else if (currentModelType === 'stl') {

}

function refreshAllMeshes() {

// Independent, non-destructive section planes. All planes clip the model and points.

}
function selectModelSurface(e) {
    if (!isInitialized || !modelGroup.children.length || !el('showModel').checked) return false;
    const rect=renderer.domElement.getBoundingClientRect();
    const mouse=new THREE.Vector2((e.clientX-rect.left)/rect.width*2-1, -(e.clientY-rect.top)/rect.height*2+1);

}

        const select=document.createElement('button'); select.type='button';

function ensureCutControl() {

function setupSurfaceInteraction() {
    const canvas=renderer.domElement, menu=el('surfaceMenu'); let rightStart=null;
    canvas.addEventListener('pointerdown',e=>{if(e.button===2) rightStart={x:e.clientX,y:e.clientY};});
    canvas.addEventListener('click',e=>{if(e.button===0 && !suppressSurfaceClick && !(cutControl && cutControl.dragging)) selectModelSurface(e);});

function addSpotCoordinate() {
    if (!selectedSurface) return;

    const point={x:p.x,y:p.y,z:p.z};
    const marker=new THREE.Mesh(new THREE.SphereGeometry(0.055,12,12),new THREE.MeshBasicMaterial({color:0x0069e8,depthTest:false}));
    marker.position.set(point.x-globalShift.x,point.y-globalShift.y,point.z-globalShift.z);
    marker.renderOrder=900; spotGroup.add(marker);
    const node=document.createElement('div'); node.className='inspectCard';
    node.textContent='East / X:  '+point.x.toFixed(3)+' m\nNorth / Y: '+point.y.toFixed(3)+' m\nElev / Z:  '+point.z.toFixed(3)+' m';

function clearAllSpotCoordinates() {
    for (const spot of spotCoordinates) {

                    const f=(e+1)%3, a=vertices[e], b=vertices[f];
                    if(Math.abs(d[e])<=eps) add(a.clone());
                    if((d[e]>eps&&d[f]<-eps)||(d[e]<-eps&&d[f]>eps)) add(a.clone().lerp(b,d[e]/(d[e]-d[f])));
                }
                if(hits.length<2) continue;
                let a=hits[0],b=hits[1], max=a.distanceToSquared(b);
                for(let h=0;h<hits.length;h++) for(let j=h+1;j<hits.length;j++) {
                    const dist=hits[h].distanceToSquared(hits[j]); if(dist>max){max=dist;a=hits[h];b=hits[j];}
                }
                a=a.clone();b=b.clone();
                if(visibleSegment(a,b,section)) lines.push(a.x,a.y,a.z,b.x,b.y,b.z);
            }
        }
    });
    if(!lines.length) return;
    const geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.Float32BufferAttribute(lines,3));
    const mat=new THREE.LineBasicMaterial({color:0x000000,transparent:true,opacity:1,depthTest:true,depthWrite:false});
    // A small depth bias limits z-fighting with the cut surface while keeping occlusion.
    mat.onBeforeCompile=shader=>{shader.vertexShader=shader.vertexShader.replace('#include <project_vertex>','#include <project_vertex>\ngl_Position.z -= 0.00001 * gl_Position.w;');};
    mat.customProgramCacheKey=()=> 'section-outline-depth-bias-v1';
    const outline=new THREE.LineSegments(geo,mat);outline.renderOrder=3;sectionLineGroup.add(outline);
}

// File Loaders
// Parse CSV as strings, including quoted commas and escaped quotes.
function parseCsvRows(text) {
    text=text.replace(/^\uFEFF/,'');
    const rows=[];let row=[],cell='',quoted=false;
    for(let i=0;i<text.length;i++) {
        const c=text[i];
        if(quoted) {
            if(c==='"') { if(text[i+1]==='"'){cell+='"';i++;} else quoted=false; }
            else cell+=c;
        } else if(c==='"' && cell==='') quoted=true;
        else if(c===','){row.push(cell);cell='';}
        else if(c==='\r'||c==='\n') {
            row.push(cell);rows.push(row);row=[];cell='';
            if(c==='\r'&&text[i+1]==='\n')i++;
        } else cell+=c;
    }
    if(quoted) throw new Error('CSV contains an unterminated quoted field.');
    if(row.length||cell!==''){row.push(cell);rows.push(row);}
    return rows;
}
el('csvInput').addEventListener('change', async e => {
    const files=Array.from(e.target.files);e.target.value='';
    if(!files.length)return;
    initThree();
    try {
        const texts=await Promise.all(files.map(file=>file.text()));
        let added=0;const noColumnI=[];
        for(let f=0;f<texts.length;f++) {
            const rows=parseCsvRows(texts[f]);if(!rows.length)continue;
            if(rows[0].length<9) noColumnI.push(files[f].name);
            const headers=rows[0].map(h=>h.toLowerCase().trim());
            const ix=headers.findIndex(h=>h.includes('east')||h==='x');
            const iy=headers.findIndex(h=>h.includes('north')||h==='y');
            const iz=headers.findIndex(h=>h.includes('elevation')||h==='z');
            for(let i=1;i<rows.length;i++) {
                const c=rows[i];
                const x=parseFloat(c[ix>=0?ix:1]),y=parseFloat(c[iy>=0?iy:2]),z=parseFloat(c[iz>=0?iz:3]);
                // F = signed deviation in metres; I = literal display text.
                const t=c[5]===undefined||c[5].trim()===''?NaN:parseFloat(c[5]);
                const text=c[8]===undefined?'':c[8];
                if(Number.isFinite(x)&&Number.isFinite(y)&&Number.isFinite(z)) {
                    csvPoints.push({x,y,z,tol:Number.isFinite(t)?t:undefined,text});
                    updateBounds(x,y,z);added++;
                }
            }
        }
        if(!added){alert('No valid ENZ points found in the selected CSV files.');return;}
        refreshAllMeshes();el('btnFit').click();
        if(noColumnI.length) console.warn('No column I in these CSV files; their tolerance text labels are blank:',noColumnI.join(', '));
    } catch(err){console.error('CSV loading failed:',err);alert('CSV loading failed: '+err.message);}
});

// PTS rows: X Y Z intensity R G B Nx Ny Nz. Point count headers are skipped.
function parsePtsPoint(line) {
    const p=line.trim().split(/\s+/); if(p.length<3) return null;
    const x=Number(p[0]),y=Number(p[1]),z=Number(p[2]);
    if(!Number.isFinite(x)||!Number.isFinite(y)||!Number.isFinite(z)) return null;
    const channel=value=>{if(value===undefined||value==='')return null;const v=Number(value);return Number.isFinite(v)&&v>=0&&v<=255?v/255:null;};
    // X Y Z I R G B Nx Ny Nz. Intensity and normals do not override RGB.
    const r=channel(p[4]),g=channel(p[5]),b=channel(p[6]);
    return {x,y,z,r,g,b,hasRGB:r!==null&&g!==null&&b!==null};
}
el('ptsInput').addEventListener('change',e=>{
    const file=e.target.files[0];if(!file)return;
    const answer=prompt('Enter percentage of point cloud to keep (1 to 100):','30');
    if(answer===null){e.target.value='';return;}
    let keepRatio=parseFloat(answer)/100;
    if(!Number.isFinite(keepRatio)||keepRatio<=0||keepRatio>1){alert('Invalid percentage. Defaulting to 30%.');keepRatio=0.3;}
    initThree();e.target.value='';
    const CHUNK=1024*1024*4;let offset=0,leftover='',missingRGB=0;
    ptsRaw=[];
    function processLines(text){
        const lines=text.split(/\r?\n/);leftover=lines.pop()||'';
        for(const line of lines){
            const clean=line.trim();if(!clean||/^\d+$/.test(clean))continue;
            if(Math.random()>keepRatio)continue;
            const point=parsePtsPoint(clean);if(!point)continue;
            if(!point.hasRGB)missingRGB++;
            ptsRaw.push(point);updateBounds(point.x,point.y,point.z);
        }
    }
    function readNext(){
        const reader=new FileReader();
        reader.onload=ev=>{
            processLines(leftover+ev.target.result);offset+=CHUNK;
            if(offset<file.size)setTimeout(readNext,5);
            else{
                if(leftover)processLines(leftover+'\n');
                if(!ptsRaw.length){alert('No valid sampled PTS points found.');return;}
                refreshAllMeshes();
                if(missingRGB) console.warn('PTS: '+missingRGB+' sampled points have missing/invalid RGB and are shown grey.');
            }
        };
        reader.onerror=()=>alert('Could not read the PTS file.');
        reader.readAsText(file.slice(offset,offset+CHUNK));
    }
    readNext();
});

el('modelInput').addEventListener('change', e => {
    const file = e.target.files[0];
    if(!file) return;
    initThree();
    clearPlaneCut(); clearSurfaceSelection();
    
    const ext = file.name.split('.').pop().toLowerCase();
    const reader = new FileReader();

    if (ext === 'dxf') {
        reader.onload = ev => {
            try {
                const parsed = parsePolyfaceDXF(ev.target.result);
                rawModelData = parsed; currentModelType = 'dxf';
                refreshAllMeshes(); el('btnFit').click();
                console.info('DXF loaded:', parsed.meshInstances, 'mesh instances,', parsed.indices.length/3, 'triangles;', parsed.definitions, 'definitions;', parsed.invalidFaces, 'invalid faces;', parsed.missingBlocks, 'missing block references.');
                parsed.warnings.forEach(w => console.warn('DXF:', w));
                if (parsed.invalidFaces || parsed.missingBlocks || parsed.warnings.length) alert('DXF loaded with warnings. See the browser console for details.');
            } catch (err) { console.error('Error parsing DXF:', err); alert('DXF loading failed: '+err.message); }
        };
        reader.onerror = () => alert('Could not read the DXF file.');
        reader.readAsText(file);
    }
    else if (ext === 'obj') {
        reader.onload = ev => {
            try {
                const loader = new THREE.OBJLoader();
                rawModelData = loader.parse(ev.target.result);
                currentModelType = 'obj';
                refreshAllMeshes();
            } catch(err) { console.error("Error parsing OBJ."); }
        };
        reader.readAsText(file);
    }
    else if (ext === 'stl') {
        reader.onload = ev => {
            try {
                const loader = new THREE.STLLoader();
                rawModelData = loader.parse(ev.target.result);
                currentModelType = 'stl';
                refreshAllMeshes();
            } catch(err) { console.error("Error parsing STL."); }
        };
        reader.readAsArrayBuffer(file);
    }
    else if (ext === 'glb' || ext === 'gltf') {
        reader.onload = ev => {
            try {
                const loader = new THREE.GLTFLoader();
                loader.parse(ev.target.result, '', (gltf) => {
                    rawModelData = gltf.scene;
                    currentModelType = 'gltf';
                    refreshAllMeshes();
                });
            } catch(err) { console.error("Error parsing GLTF."); }
        };
        reader.readAsArrayBuffer(file);
    }
});

// UI Control Listeners
function placeImportsTab() {
    const panel=el('bottomLoader'), tab=el('toggleImports');
    if (panel.classList.contains('imports-collapsed')) tab.style.bottom='0px';
    else tab.style.bottom=Math.max(0,window.innerHeight-panel.getBoundingClientRect().top)+'px';
}
el('toggleImports').addEventListener('click',()=>{
    const panel=el('bottomLoader'), tab=el('toggleImports');
    panel.classList.toggle('imports-collapsed');
    const collapsed=panel.classList.contains('imports-collapsed');
    tab.textContent=collapsed ? '▲ Imports' : '▼ Imports';
    tab.title=collapsed ? 'Expand imports' : 'Minimize imports';
    tab.setAttribute('aria-expanded',String(!collapsed));
    placeImportsTab();
});
window.addEventListener('resize',placeImportsTab);
requestAnimationFrame(placeImportsTab);
el('clearAllSections').addEventListener('click',()=>{ if(isInitialized){clearPlaneCut();clearSurfaceSelection();} });
el('toggleSettings').addEventListener('click', () => {
    const panel = el('rightToolbar');
    panel.classList.toggle('collapsed');
    const collapsed=panel.classList.contains('collapsed'), tab=el('toggleSettings');
    tab.classList.toggle('panel-collapsed',collapsed);
    tab.textContent=collapsed ? '◀' : '▶';
    tab.setAttribute('aria-expanded',String(!collapsed));
    tab.setAttribute('aria-label',collapsed ? 'Expand settings' : 'Minimize settings');
    tab.title=collapsed ? 'Expand settings' : 'Minimize settings';
});

el('btnFit').addEventListener('click', () => {
    if(!isInitialized) return;
    const box = new THREE.Box3();
    if(csvGroup.children.length) box.expandByObject(csvGroup);
    if(ptsGroup.children.length) box.expandByObject(ptsGroup);
    if(modelGroup.children.length) box.expandByObject(modelGroup);
    
    if(!isFinite(box.min.x)) return;
    const center = box.getCenter(new THREE.Vector3());
    const size = box.getSize(new THREE.Vector3());
    const radius = Math.max(size.x, size.y, size.z) || 1;
    
    controls.target.copy(center);
    camera.position.set(center.x + radius*1.5, center.y - radius*1.5, center.z + radius);
    
    if (camera.isOrthographicCamera) {
        const aspect = window.innerWidth / window.innerHeight;
        camera.left = -radius * 1.5 * aspect;
        camera.right = radius * 1.5 * aspect;
        camera.top = radius * 1.5;
        camera.bottom = -radius * 1.5;
        camera.updateProjectionMatrix();
    }
    controls.update();
});

el('orthoToggle').addEventListener('change', e => {
    if(!isInitialized) return;
    const aspect = window.innerWidth / window.innerHeight;
    const oldPos = camera.position.clone();
    const oldTarget = controls.target.clone();
    
    if (!e.target.checked) {
        camera = new THREE.PerspectiveCamera(60, aspect, 0.1, 100000);
    } else {
        const dist = oldPos.distanceTo(oldTarget) || 50;
        camera = new THREE.OrthographicCamera(-dist * aspect / 2, dist * aspect / 2, dist / 2, -dist / 2, 0.1, 100000);
    }
    camera.position.copy(oldPos);
    camera.up.set(0, 0, 1);
    if (cutControl) cutControl.camera = camera;
    
    controls.dispose();
    controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.target.copy(oldTarget);
    controls.screenSpacePanning = true;
    
    refreshAllMeshes();
});

['showTolText', 'tolTextSize', 'maxTolFilter', 'ootThreshold'].forEach(id => {
    el(id).addEventListener('input', () => {
        buildCsvMesh();
    });
});

['showCsv', 'csvSize', 'showPts', 'ptsOpacity', 'showModel', 'modelOpacity'].forEach(id => {
    el(id).addEventListener('input', () => {
        if (id.includes('Csv') || id === 'csvSize') buildCsvMesh();
        if (id.includes('Pts') || id === 'ptsOpacity') buildPtsMesh();
        if (id.includes('Model') || id === 'modelOpacity') buildModelMesh();
    });
});
